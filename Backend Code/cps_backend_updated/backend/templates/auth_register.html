{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css')}}">

<div class="login-page-bg">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-img">
        <img src="{{ url_for('static', filename='images/logo.png')}}" class="login-logo" alt="Logo">
      </div>
      <h1 class="login-title">SCPS</h1>
      <p class="login-subtitle">Create your Account</p>
    </div>

    <form onsubmit="return false;">
      <div class="form-group">
        <label for="exampleInputtext1" class="form-label">User Name</label>
        <input type="text" class="form-control custom-input" id="exampleInputtext1" aria-describedby="textHelp"
          placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label for="exampleInputEmail1" class="form-label">Email Address</label>
        <input type="email" class="form-control custom-input" id="exampleInputEmail1" aria-describedby="emailHelp"
          placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="exampleInputPassword1" class="form-label">Password</label>
        <input type="password" class="form-control custom-input" id="exampleInputPassword1"
          placeholder="Enter your password">
      </div>
      <div class="form-group">
        <label for="exampleInputPassword2" class="form-label">Confirm Password</label>
        <input type="password" class="form-control custom-input" id="exampleInputPassword2"
          placeholder="Confirm your password">
      </div>

      <button id="sign_up_btn" class="btn btn-login">Sign Up</button>

      <div class="login-footer">
        <p class="mb-0">Already have an Account? <a class="link-primary ms-1" href="{{url_for('auth_view.login')}}">Sign
            In</a></p>
      </div>
    </form>
  </div>
</div>
<script>
  $('#sign_up_btn').on('click', async function (e) {
    let name = $('#exampleInputtext1').val().toString();
    let email = $('#exampleInputEmail1').val().toString();
    let password = $('#exampleInputPassword1').val().toString();
    let password2 = $('#exampleInputPassword2').val().toString();
    showLoader();
    const response = await fetch('/signup', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ name, email, password, password2 })
    });

    const result = await response.json();
    console.log(result);

    closeLoader();
    if (result.success) {
      Swal.fire({
        icon: 'success',
        title: 'Sign Up',
        allowOutsideClick: false,
        allowEscapeKey: false,
        text: result.msg || 'Account created successfully!',
        timer: 2000,
        showConfirmButton: false
      });

      setTimeout(function () {
        window.location.href = result.redirect;
      }, 2000);
    } else {
      Swal.fire({
        icon: 'error',
        title: 'Oops...',
        text: result.error || 'Something went wrong!!!'
      });
    }
  });

</script>
{% endblock %}
