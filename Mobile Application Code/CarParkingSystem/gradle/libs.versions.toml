[versions]
agp = "8.9.1"
checkout = "1.6.41"
drawerlayout = "1.2.0"
glide = "4.16.0"
compiler = "4.16.0"
kotlin = "2.0.21"
coreKtx = "1.15.0"
junit = "4.13.2"
